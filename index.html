document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tems:center;gap:2px;background:#fff;border:1px solid #EAE8E1;border-radius:9px;padding:3px\">\n        <button onclick=\"{{ prevMonth }}\" aria-label=\"Previous month\" style=\"border:none;background:transparent;width:30px;height:30px;border-radius:7px;font-size:18px;color:#56554F;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#F2F1EC\">\u2039<\u002Fbutton>\n        <span class=\"tn\" style=\"min-width:118px;text-align:center;font-weight:500;font-size:14px\">{{ monthLabelText }}<\u002Fspan>\n        <button onclick=\"{{ nextMonth }}\" aria-label=\"Next month\" style=\"border:none;background:transparent;width:30px;height:30px;border-radius:7px;font-size:18px;color:#56554F;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#F2F1EC\">\u203a<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <button onclick=\"{{ openSettings }}\" aria-label=\"Settings\" style=\"border:1px solid #EAE8E1;background:#fff;color:#56554F;border-radius:9px;height:38px;padding:0 14px;font-size:14px;font-weight:500\" style-hover=\"background:#F2F1EC\">Settings<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1080px;margin:0 auto;padding:22px 18px 24px\">\n\n    <!-- ===================== DASHBOARD ===================== -->\n    <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n          <div>\n            <div style=\"font-size:12px;color:#8A897F;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">Overview<\u002Fdiv>\n            <h1 style=\"margin:2px 0 0;font-size:26px;font-weight:600;letter-spacing:-.02em\">{{ monthLabelText }}<\u002Fh1>\n          <\u002Fdiv>\n          <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n \"{{ true }}\">\n          <div>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px\">\n              <div style=\"font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase\">Categories<\u002Fdiv>\n              <button onclick=\"{{ openAddCategory }}\" style=\"border:none;background:transparent;color:#56554F;font-size:14px;font-weight:500;padding:4px 6px\" style-hover=\"color:#1B1B19\">+ Add category<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"5\">\n                <button onclick=\"{{ row.onClick }}\" aria-label=\"Open category\" style=\"display:block;width:100%;text-align:left;background:#fff;border:1px solid #EAE8E1;border-radius:12px;padding:14px 15px\" style-hover=\"border-color:#D9D7CE;background:#FFFEFB\">\n                  <div style=\"display:flex;align-items:center;gap:13px\">\n                    <div style=\"width:42px;height:42px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;background:{{ row.tint }}\">{{ row.emoji }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n                        <span style=\"font-weight:600;font-size:15.5px\">{{ row.name }}<\u002Fspan>\n                        <span class=\"tn\" style=\"font-weight:600;font-size:15.5px\">{{ row.spentText }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:2px\">\n                        <span class=\"tn\" style=\"color:#8A897F;font-size:13px\">{{ row.limitText }}<\u002Fspan>\n                        <span class=\"tn\" style=\"font-size:13px;font-weight:500;color:{{ row.pctColor }}\">{{ row.pctText }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"margin-top:9px;height:6px;border-radius:5px;background:#EFEDE6;overflow:hidden\">\n                        <div style=\"height:100%;border-radius:5px;width:{{ row.barPct }}%;background:{{ row.barColor }};transition:width .3s\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"color:#C9C8C1;font-size:20px;flex:none\">\u203a<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noCategories }}\">\n          <div style=\"text-align:center;padding:54px 20px;color:#8A897F\">\n            <div style=\"font-size:34px\">\ud83d\uddc2\ufe0f<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:16px;font-weight:600;color:#1B1B19\">No categories yet<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:14px\">Create your first spending category to start tracking.<\u002Fdiv>\n            <button onclick=\"{{ openAddCategory }}\" style=\"margin-top:16px;border:none;background:#1B1B19;color:#fff;border-radius:9px;padding:11px 18px;font-size:15px;font-weight:600\">+ Add category<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== CATEGORY DETAIL ===================== -->\n    <sc-if value=\"{{ isCategory }}\">\n      <div>\n        <button onclick=\"{{ goDashboard }}\" style=\"border:none;background:transparent;color:#8A897F;font-size:14px;font-weight:500;padding:4px 0;margin-bottom:8px\" style-hover=\"color:#1B1B19\">\u2039 Back to dashboard<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:18px\">\n          <div style=\"width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;background:{{ cat.tint }}\">{{ cat.emoji }}<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em\">{{ cat.name }}<\u002Fh1>\n        <\u002Fdiv>\n\n        <div style=\"display:inline-flex;background:#EFEDE6;border-radius:10px;padding:3px;margin-bottom:18px\">\n          <button onclick=\"{{ showCatExpenses }}\" style=\"{{ catTabExpStyle }}\">Expenses<\u002Fbutton>\n          <button onclick=\"{{ showCatSettings }}\" style=\"{{ catTabSetStyle }}\">Settings<\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- TAB A: Expense list -->\n        <sc-if value=\"{{ catTabExpenses }}\">\n          <div>\n            <div style=\"background:#fff;border:1px solid #EAE8E1;border-radius:14px;padding:18px 20px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n                <div>\n                  <div style=\"font-size:12px;color:#8A897F;font-weight:500;letter-spacing:.03em;text-transform:uppercase\">{{ monthLabelText }}<\u002Fdiv>\n                  <div class=\"tn\" style=\"font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:3px\">{{ cat.spentText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right\">\n                  <div class=\"tn\" style=\"color:#8A897F;font-size:14px\">{{ cat.limitText }}<\u002Fdiv>\n                  <div class=\"tn\" style=\"font-size:14px;font-weight:600;color:{{ cat.pctColor }};margin-top:2px\">{{ cat.pctText }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ cat.hasLimit }}\">\n                <div style=\"margin-top:14px;height:8px;border-radius:6px;background:#EFEDE6;overflow:hidden\">\n                  <div style=\"height:100%;border-radius:6px;width:{{ cat.barPct }}%;background:{{ cat.barColor }};transition:width .3s\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px\">\n              <div style=\"font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase\">History<\u002Fdiv>\n              <button onclick=\"{{ addExpenseHere }}\" style=\"border:none;background:#1B1B19;color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600\" style-hover=\"background:#33322E\">+ Add expense<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ catHasExpenses }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ cat.list }}\" as=\"e\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #EAE8E1;border-radius:11px;padding:12px 14px\">\n                    <div style=\"flex:1;min-width:0\">\n                      <div class=\"tn\" style=\"font-weight:600;font-size:15.5px\">{{ e.amountText }}<\u002Fdiv>\n                      <div style=\"display:flex;gap:8px;align-items:center;margin-top:2px\">\n                        <span class=\"tn\" style=\"font-size:13px;color:#8A897F\">{{ e.dateText }}<\u002Fspan>\n                        <sc-if value=\"{{ e.hasNote }}\"><span style=\"font-size:13px;color:#56554F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">\u00b7 {{ e.note }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <button onclick=\"{{ e.onEdit }}\" aria-label=\"Edit expense\" style=\"border:1px solid #EAE8E1;background:#fff;color:#56554F;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500\" style-hover=\"background:#F2F1EC;color:#1B1B19\">Edit<\u002Fbutton>\n                    <button onclick=\"{{ e.onDelete }}\" aria-label=\"Delete expense\" style=\"border:1px solid #EAE8E1;background:#fff;color:#C0492F;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500\" style-hover=\"background:#FBF1EE;border-color:#E7C6BD\">Delete<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ catNoExpenses }}\">\n              <div style=\"text-align:center;padding:38px 20px;color:#8A897F;background:#fff;border:1px dashed #E2E0D8;border-radius:12px\">\n                <div style=\"font-size:28px\">\ud83e\uddfe<\u002Fdiv>\n                <div style=\"margin-top:8px;font-size:14px\">No expenses logged in {{ monthLabelText }}.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TAB B: Category settings -->\n        <sc-if value=\"{{ catTabSettings }}\">\n          <div style=\"background:#fff;border:1px solid #EAE8E1;border-radius:14px;padding:20px;max-width:520px\">\n            <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px\">Name<\u002Flabel>\n            <input value=\"{{ cf.name }}\" onchange=\"{{ cfName }}\" placeholder=\"Category name\" style=\"width:100%;border:1px solid #DAD8D0;border-radius:8px;padding:10px 12px;font-size:15px;background:#fff;color:#1B1B19;outline:none\" style-focus=\"border-color:#1B1B19\">\n\n            <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:16px 0 8px\">Icon<\u002Flabel>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n              <sc-for list=\"{{ emojiChips }}\" as=\"em\" hint-placeholder-count=\"12\">\n                <button onclick=\"{{ em.onClick }}\" aria-label=\"Pick icon\" style=\"{{ em.style }}\">{{ em.em }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:16px 0 8px\">Color<\u002Flabel>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n              <sc-for list=\"{{ colorSwatches }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <button onclick=\"{{ c.onClick }}\" aria-label=\"Pick color\" style=\"{{ c.style }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:16px 0 6px\">Monthly limit <span style=\"text-transform:none;letter-spacing:0;font-weight:400\">(0 = no limit)<\u002Fspan><\u002Flabel>\n            <input value=\"{{ cf.limit }}\" onchange=\"{{ cfLimit }}\" inputmode=\"decimal\" placeholder=\"0\" style=\"width:100%;border:1px solid #DAD8D0;border-radius:8px;padding:10px 12px;font-size:15px;background:#fff;color:#1B1B19;outline:none\" style-focus=\"border-color:#1B1B19\">\n\n            <sc-if value=\"{{ hasErr }}\"><div style=\"margin-top:12px;color:#C0492F;font-size:13.5px;font-weight:500\">{{ err }}<\u002Fdiv><\u002Fsc-if>\n\n            <div style=\"display:flex;gap:10px;margin-top:20px\">\n              <button onclick=\"{{ saveCategoryEdits }}\" style=\"flex:1;border:none;background:#1B1B19;color:#fff;border-radius:8px;padding:11px;font-size:15px;font-weight:600\" style-hover=\"background:#33322E\">Save changes<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid #EFEDE6\">\n              <button onclick=\"{{ openDeleteCategory }}\" style=\"border:1px solid #E7C6BD;background:#fff;color:#C0492F;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600\" style-hover=\"background:#FBF1EE\">Delete category<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== ANALYTICS ===================== -->\n    <sc-if value=\"{{ isAnalytics }}\">\n      <div>\n        <h1 style=\"margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-.02em\">Analytics<\u002Fh1>\n        <div style=\"color:#8A897F;font-size:14px;margin-bottom:18px\">{{ prevMonthLabel }} \u2192 {{ monthLabelText }}<\u002Fdiv>\n\n        <!-- Month-by-month spend -->\n        <div style=\"font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:0 2px 10px\">Month-by-month spend<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #EAE8E1;border-radius:14px;padding:2px 18px\">\n          <sc-for list=\"{{ monthly }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #F4F2EC\">\n              <span style=\"display:flex;align-items:center;gap:8px;font-weight:500;font-size:14.5px\">{{ m.label }}<sc-if value=\"{{ m.isCurrent }}\"><span style=\"font-size:11px;font-weight:600;color:#56554F;background:#F2F1EC;border-radius:5px;padding:2px 7px\">This month<\u002Fspan><\u002Fsc-if><\u002Fspan>\n              <span style=\"display:flex;align-items:baseline;gap:14px\"><span class=\"tn\" style=\"font-weight:600;font-size:15.5px\">{{ m.amountText }}<\u002Fspan><span class=\"tn\" style=\"width:118px;text-align:right;font-size:13px;font-weight:600;color:{{ m.deltaColor }}\">{{ m.deltaText }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- Insights -->\n        <div style=\"margin:24px 2px 10px;font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase\">Where to spend less<\u002Fdiv>\n        <sc-if value=\"{{ hasInsights }}\">\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ insights }}\" as=\"ins\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:12px;background:#fff;border:1px solid #EAE8E1;border-radius:12px;padding:14px 16px\">\n                <div style=\"width:9px;height:9px;border-radius:50%;background:{{ ins.dot }};margin-top:6px;flex:none\"><\u002Fdiv>\n                <div style=\"font-size:14.5px;line-height:1.5;color:#33322E\">{{ ins.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noInsights }}\">\n          <div style=\"text-align:center;padding:32px 20px;color:#8A897F;background:#fff;border:1px dashed #E2E0D8;border-radius:12px\">\n            <div style=\"font-size:26px\">\ud83d\udca1<\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:14px\">Not enough data yet. Log a few expenses across two months to get suggestions.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Comparison -->\n        <div style=\"margin:26px 2px 10px;font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase\">By category<\u002Fdiv>\n        <sc-if value=\"{{ hasComp }}\">\n          <div style=\"background:#fff;border:1px solid #EAE8E1;border-radius:14px;overflow:hidden\">\n            <div style=\"display:flex;gap:10px;padding:11px 16px;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border-bottom:1px solid #EFEDE6\">\n              <span style=\"flex:1\">Category<\u002Fspan>\n              <span class=\"tn\" style=\"width:90px;text-align:right\">This<\u002Fspan>\n              <span class=\"tn\" style=\"width:90px;text-align:right\">Last<\u002Fspan>\n              <span style=\"width:74px;text-align:right\">Change<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ comp }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #F4F2EC\">\n                <span style=\"flex:1;display:flex;align-items:center;gap:9px;min-width:0\"><span style=\"font-size:17px\">{{ r.emoji }}<\u002Fspan><span style=\"font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}<\u002Fspan><\u002Fspan>\n                <span class=\"tn\" style=\"width:90px;text-align:right;font-weight:600;font-size:14.5px\">{{ r.curText }}<\u002Fspan>\n                <span class=\"tn\" style=\"width:90px;text-align:right;color:#8A897F;font-size:14px\">{{ r.prevText }}<\u002Fspan>\n                <span style=\"width:74px;text-align:right;font-size:13px;font-weight:600;color:{{ r.dirColor }}\">{{ r.dirText }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noComp }}\">\n          <div style=\"text-align:center;padding:32px 20px;color:#8A897F;background:#fff;border:1px dashed #E2E0D8;border-radius:12px\">\n            <div style=\"font-size:14px\">No spending recorded in these two months.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== SAVINGS ===================== -->\n    <sc-if value=\"{{ isSavings }}\">\n      <div>\n        <h1 style=\"margin:0 0 18px;font-size:26px;font-weight:600;letter-spacing:-.02em\">Savings<\u002Fh1>\n\n        <!-- Monthly savings log -->\n        <div style=\"background:#fff;border:1px solid #EAE8E1;border-radius:14px;padding:18px 20px\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:12px;color:#8A897F;font-weight:500;letter-spacing:.03em;text-transform:uppercase\">Total saved<\u002Fdiv>\n              <div class=\"tn\" style=\"font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:3px\">{{ totalSavedText }}<\u002Fdiv>\n              <div class=\"tn\" style=\"font-size:13px;color:#8A897F;margin-top:2px\">Saved in {{ monthLabelText }}: {{ savedThisText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button onclick=\"{{ logSavings }}\" style=\"border:none;background:#1B1B19;color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600\" style-hover=\"background:#33322E\">Log this month<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasSavLog }}\">\n            <div style=\"margin-top:16px;border-top:1px solid #EFEDE6;padding-top:6px\">\n              <sc-for list=\"{{ savLog }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F4F2EC\">\n                  <span style=\"font-size:14px;color:#56554F\">{{ m.label }}<\u002Fspan>\n                  <span style=\"display:flex;align-items:center;gap:12px\"><span class=\"tn\" style=\"font-weight:600;font-size:14.5px\">{{ m.amountText }}<\u002Fspan><button onclick=\"{{ m.onEdit }}\" aria-label=\"Edit savings\" style=\"border:none;background:transparent;color:#8A897F;font-size:13px;font-weight:500\" style-hover=\"color:#1B1B19\">Edit<\u002Fbutton><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Saving pockets -->\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px\">\n          <div style=\"font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase\">Saving pockets<\u002Fdiv>\n          <button onclick=\"{{ openAddPocket }}\" style=\"border:none;background:transparent;color:#56554F;font-size:14px;font-weight:500\" style-hover=\"color:#1B1B19\">+ New pocket<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasPockets }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px\">\n            <sc-for list=\"{{ pockets }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <div style=\"background:#fff;border:1px solid #EAE8E1;border-radius:14px;padding:18px\">\n                <div style=\"display:flex;align-items:center;gap:11px\">\n                  <div style=\"width:40px;height:40px;border-radius:11px;background:#F2F1EC;display:flex;align-items:center;justify-content:center;font-size:20px\">{{ p.emoji }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:7px\"><span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan><sc-if value=\"{{ p.reached }}\"><span style=\"font-size:12px;font-weight:600;color:#3E8E5A;background:#EAF4ED;border-radius:6px;padding:2px 7px;flex:none\">\ud83c\udf89 Reached<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                    <div class=\"tn\" style=\"font-size:13px;color:#8A897F;margin-top:1px\">{{ p.savedText }} of {{ p.targetText }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;height:8px;border-radius:6px;background:#EFEDE6;overflow:hidden\">\n                  <div style=\"height:100%;border-radius:6px;width:{{ p.pct }}%;background:{{ p.barColor }};transition:width .3s\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:6px\">\n                  <span class=\"tn\" style=\"font-size:12.5px;color:#8A897F\">{{ p.pctText }}<\u002Fspan>\n                  <sc-if value=\"{{ p.hasDeadline }}\"><span class=\"tn\" style=\"font-size:12.5px;color:#8A897F\">by {{ p.deadlineText }}<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:7px;margin-top:14px\">\n                  <button onclick=\"{{ p.onAdd }}\" style=\"flex:1;border:1px solid #EAE8E1;background:#fff;color:#1B1B19;border-radius:8px;padding:8px;font-size:13.5px;font-weight:600\" style-hover=\"background:#F2F1EC\">+ Add<\u002Fbutton>\n                  <button onclick=\"{{ p.onWithdraw }}\" style=\"flex:1;border:1px solid #EAE8E1;background:#fff;color:#56554F;border-radius:8px;padding:8px;font-size:13.5px;font-weight:500\" style-hover=\"background:#F2F1EC\">Withdraw<\u002Fbutton>\n                  <button onclick=\"{{ p.onEdit }}\" aria-label=\"Edit pocket\" style=\"border:1px solid #EAE8E1;background:#fff;color:#56554F;border-radius:8px;padding:8px 11px;font-size:13.5px;font-weight:500\" style-hover=\"background:#F2F1EC\">Edit<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noPockets }}\">\n          <div style=\"text-align:center;padding:40px 20px;color:#8A897F;background:#fff;border:1px dashed #E2E0D8;border-radius:12px\">\n            <div style=\"font-size:28px\">\ud83d\udc37<\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:14px\">No saving pockets yet. Create a goal to track your progress.<\u002Fdiv>\n            <button onclick=\"{{ openAddPocket }}\" style=\"margin-top:14px;border:none;background:#1B1B19;color:#fff;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600\">+ New pocket<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ===================== BOTTOM TAB BAR (mobile) ===================== -->\n  <sc-if value=\"{{ narrow }}\">\n    <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(247,246,242,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #EAE8E1;display:flex;align-items:center;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))\">\n      <button onclick=\"{{ goDashboard }}\" style=\"{{ tabDashStyle }}\">Home<\u002Fbutton>\n      <button onclick=\"{{ goAnalytics }}\" style=\"{{ tabAnaStyle }}\">Stats<\u002Fbutton>\n      <button o 4s\">\n      <div onclick=\"{{ stop }}\" style=\"background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:26px 22px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:sheetIn .28s cubic-bezier(.32,.72,0,1);position:relative\" style-before=\"content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:3px;background:#E2E0D8\">\n        <div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">Delete \u201c{{ cat.name }}\u201d?<\u002Fdiv>\n        <div style=\"font-size:14px;color:#56554F;line-height:1.5;margin-bottom:16px\">This category has <b>{{ delCatCount }}<\u002Fb> expense(s). Choose what to do with them.<\u002Fdiv>\n        <button onclick=\"{{ delModeReassign }}\" style=\"{{ delReassignStyle }}\">\n          <div style=\"font-weight:600;font-size:14.5px\">Move expenses to another category<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8A897F;margin-top:2px\">Keep the records, reassign them.<\u002Fdiv>\n        <\u002Fbutton>\n        <sc-if value=\"{{ delIsReassign }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px\">\n            <sc-for list=\"{{ delTargets }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><span>{{ t.emoji }}<\u002Fspan><span>{{ t.name }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button onclick=\"{{ delModeDelete }}\" style=\"{{ delDeleteStyle }}\">\n          <div style=\"font-weight:600;font-size:14.5px;color:#C0492F\">Delete the expenses too<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8A897F;margin-top:2px\">Permanently remove all {{ delCatCount }} record(s).<\u002Fdiv>\n        <\u002Fbutton>\n        <sc-if value=\"{{ hasErr }}\"><div style=\"margin-top:12px;color:#C0492F;font-size:13.5px;font-weight:500\">{{ err }}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;gap:10px;margin-top:20px\">\n          <button onclick=\"{{ closeModal }}\" style=\"flex:1;border:1px solid #DAD8D0;background:#fff;color:#1B1B19;border-radius:9px;padding:12px;font-size:15px;font-weight:500\" style-hover=\"background:#F2F1EC\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ confirmDeleteCategory }}\" style=\"flex:1.2;border:none;background:#C0492F;color:#fff;border-radius:9px;padding:12px;font-size:15px;font-weight:600\" style-hover=\"background:#A23D27\">Delete category<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Settings -->\n  <sc-if value=\"{{ showSettingsModal }}\">\n    <div onclick=\"{{ closeModal }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(20,19,17,.4);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .14s\">\n      <div onclick=\"{{ stop }}\" style=\"background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:26px 22px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:sheetIn .28s cubic-bezier(.32,.72,0,1);position:relative\" style-before=\"content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:3px;background:#E2E0D8\">\n        <div style=\"font-size:19px;font-weight:600;margin-bottom:16px\">Settings<\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px\">\n          <div style=\"flex:1\">\n            <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px\">Currency symbol<\u002Flabel>\n            <input value=\"{{ stf.currencySymbol }}\" onchange=\"{{ stfSymbol }}\" maxlength=\"3\" style=\"width:100%;border:1px solid #DAD8D0;border-radius:8px;padding:10px 12px;font-size:15px;background:#fff;color:#1B1B19;outline:none\" style-focus=\"border-color:#1B1B19\">\n          <\u002Fdiv>\n          <div style=\"flex:1\">\n            <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px\">Position<\u002Flabel>\n            <div style=\"display:flex;background:#EFEDE6;border-radius:8px;padding:3px\">\n              <button onclick=\"{{ stfPrefix }}\" style=\"{{ stfPrefixStyle }}\">\u0e3f1,000<\u002Fbutton>\n              <button onclick=\"{{ stfSuffix }}\" style=\"{{ stfSuffixStyle }}\">1,000\u0e3f<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <label style=\"display:block;font-size:12px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:16px 0 6px\">Month starts on day<\u002Flabel>\n        <input value=\"{{ stf.monthStartDay }}\" onchange=\"{{ stfStartDay }}\" inputmode=\"numeric\" placeholder=\"1\" style=\"width:100%;border:1px solid #DAD8D0;border-radius:8px;padding:10px 12px;font-size:15px;background:#fff;color:#1B1B19;outline:none\" style-focus=\"border-color:#1B1B19\">\n        <div style=\"font-size:12px;color:#A3A29B;margin-top:5px\">Budgets reset on this day each month (1\u201328).<\u002Fdiv>\n\n        <div style=\"margin-top:20px;padding-top:18px;border-top:1px solid #EFEDE6\">\n          <div style=\"font-size:13px;color:#8A897F;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px\">Backup<\u002Fdiv>\n          <div style=\"font-size:13px;color:#56554F;line-height:1.5;margin-bottom:12px\">Your data lives only on this device. Export regularly to keep a safe backup.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button onclick=\"{{ exportJSON }}\" style=\"flex:1;min-width:140px;border:1px solid #DAD8D0;background:#fff;color:#1B1B19;border-radius:9px;padding:11px;font-size:14px;font-weight:600\" style-hover=\"background:#F2F1EC\">\u2b07 Export backup<\u002Fbutton>\n            <label style=\"flex:1;min-width:140px;border:1px solid #DAD8D0;background:#fff;color:#1B1B19;border-radius:9px;padding:11px;font-size:14px;font-weight:600;text-align:center;cursor:pointer\" style-hover=\"background:#F2F1EC\">\u2b06 Import backup<input type=\"file\" accept=\"application\u002Fjson,.json\" onchange=\"{{ onImportFile }}\" style=\"display:none\"><\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:18px;padding-top:18px;border-top:1px solid #EFEDE6;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n          <button onclick=\"{{ clearAll }}\" style=\"border:none;background:transparent;color:#C0492F;font-size:14px;font-weight:500;padding:0\" style-hover=\"text-decoration:underline\">Clear all data<\u002Fbutton>\n          <button onclick=\"{{ saveSettings }}\" style=\"border:none;background:#1B1B19;color:#fff;border-radius:9px;padding:11px 22px;font-size:15px;font-weight:600\" style-hover=\"background:#33322E\">Done<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Confirm dialog -->\n  <sc-if value=\"{{ showConfirm }}\">\n    <div onclick=\"{{ closeConfirm }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .14s\">\n      <div onclick=\"{{ stop }}\" style=\"background:#fff;width:100%;max-width:360px;border-radius:18px 18px 0 0;padding:26px 22px calc(20px + env(safe-area-inset-bottom));animation:sheetIn .28s cubic-bezier(.32,.72,0,1);position:relative\" style-before=\"content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:3px;background:#E2E0D8\">\n        <div style=\"font-size:17px;font-weight:600\">{{ confirmTitle }}<\u002Fdiv>\n        <div style=\"font-size:14px;color:#56554F;line-height:1.5;margin-top:7px\">{{ confirmMessage }}<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:20px\">\n          <button onclick=\"{{ closeConfirm }}\" style=\"flex:1;border:1px solid #DAD8D0;background:#fff;color:#1B1B19;border-radius:9px;padding:11px;font-size:15px;font-weight:500\" style-hover=\"background:#F2F1EC\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ runConfirm }}\" style=\"{{ confirmBtnStyle }}\">{{ confirmLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;warnThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:80,&quot;min&quot;:50,&quot;max&quot;:95,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Budget&quot;,&quot;label&quot;:&quot;Warning threshold&quot;},&quot;chartMonths&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:6,&quot;options&quot;:[3,6,12],&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Analytics&quot;,&quot;label&quot;:&quot;Trend months&quot;}}\">\nclass Component extends DCLogic {\n  PALETTE = ['#E0892F','#3E8E5A','#7C5CFC','#2A6FDB','#C0492F','#0E9594','#D14D8B','#1B1B19'];\n  EMOJIS = ['\ud83c\udf5c','\ud83d\ude8c','\ud83d\udecd\ufe0f','\ud83e\uddfe','\ud83c\udfac','\u2615','\ud83c\udfe0','\ud83d\udc8a','\ud83c\udfae','\ud83d\udcda','\u2708\ufe0f','\ud83d\udc3e','\ud83d\udca1','\ud83c\udf7a','\ud83c\udf81','\ud83d\udc85','\u26fd','\ud83e\udd57'];\n  POCKET_EMOJIS = ['\ud83c\udfaf','\u2708\ufe0f','\ud83c\udfe0','\ud83d\ude97','\ud83d\udcbb','\ud83d\udcf1','\ud83d\udedf','\ud83d\udc8d','\ud83c\udf93','\ud83c\udf81'];\n\n  constructor(props){\n    super(props);\n    const data = this.load();\n    this.state = {\n      data,\n      view:'dashboard',\n      selectedMonth: this.periodKey(this.todayISO(), data.settings.monthStartDay),\n      categoryId:null,\n      catTab:'expenses',\n      modal:null,\n      confirm:null,\n      narrow:false,\n      err:null,\n      ef:this.blankExpense(),\n      cf:this.blankCategory(),\n      pf:this.blankPocket(),\n      af:{pocketId:'',pocketName:'',amount:'',mode:'add'},\n      lf:{month:'',amount:''},\n      stf:{currencySymbol:'\u0e3f',currencyPosition:'prefix',monthStartDay:1},\n      savingsSuggested:0,\n      editExpenseId:null,\n      editPocketId:null,\n      delCat:{mode:'reassign',reassignTo:''},\n    };\n  }\n\n  componentDidMount(){\n    this.onResize = () => this.setState({narrow: window.innerWidth < 720});\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n  }\n  componentWillUnmount(){ window.removeEventListener('resize', this.onResize); }\n\n  \u002F* ---------- persistence ---------- *\u002F\n  load(){\n    try{ const raw = localStorage.getItem('ledger_expense_v1'); if(raw){ const d=JSON.parse(raw); if(d && d.settings && Array.isArray(d.categories)) return d; } }catch(e){}\n    return this.seed();\n  }\n  commit(next){ try{ localStorage.setItem('ledger_expense_v1', JSON.stringify(next)); }catch(e){} this.setState({data:next}); }\n  clone(){ return JSON.parse(JSON.stringify(this.state.data)); }\n  uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\n\n  seed(){\n    return {\n      settings:{currencySymbol:'\u0e3f',currencyPosition:'prefix',monthStartDay:1},\n      categories:[], expenses:[],\n      savingsGoals:[],\n      monthlySavings:[],\n    };\n  }\n\n  \u002F* ---------- dates ---------- *\u002F\n  todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\n  periodKey(iso, startDay){ const p=iso.split('-').map(Number); let yy=p[0], mm=p[1], dd=p[2]; if(dd < (startDay||1)){ mm--; if(mm<1){mm=12;yy--;} } return yy+'-'+String(mm).padStart(2,'0'); }\n  addMonths(key, delta){ const p=key.split('-').map(Number); let y=p[0], m=p[1]+delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); }\n  monthLabel(key){ const p=key.split('-').map(Number); const n=['January','February','March','April','May','June','July','August','September','October','November','December']; return n[p[1]-1]+' '+p[0]; }\n  shortMonth(key){ const p=key.split('-').map(Number); const n=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return n[p[1]-1]; }\n  niceDate(iso){ const p=iso.split('-').map(Number); const n=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return n[p[1]-1]+' '+p[2]+', '+p[0]; }\n\n  \u002F* ---------- money ---------- *\u002F\n  fmt(n){ const s=this.state.data.settings; const v=Number(n||0); const str=v.toLocaleString('en-US',{maximumFractionDigits:2}); return s.currencyPosition==='suffix' ? str+s.currencySymbol : s.currencySymbol+str; }\n  fmtShort(n){ const s=this.state.data.settings.currencySymbol; const v=Number(n||0); let str; if(v>=1000){ str=(v\u002F1000).toFixed(v>=10000?0:1).replace(\u002F\\.0$\u002F,'')+'k'; } else str=String(Math.round(v)); return s+str; }\n\n  \u002F* ---------- aggregates ---------- *\u002F\n  spentFor(catId, month){ const sd=this.state.data.settings.monthStartDay; return this.state.data.expenses.filter(e=>e.categoryId===catId && this.periodKey(e.date,sd)===month).reduce((s,e)=>s+Number(e.amount||0),0); }\n  totalLimit(){ return this.state.data.categories.reduce((s,c)=>s+(Number(c.monthlyLimit)||0),0); }\n  totalSpentMonth(m){ return this.state.data.categories.reduce((s,c)=>s+this.spentFor(c.id,m),0); }\n\n  \u002F* ---------- blanks ---------- *\u002F\n  blankExpense(){ return {amount:'',categoryId:'',date:this.todayISO(),note:''}; }\n  blankCategory(){ return {name:'',emoji:'\ud83d\udfe1',color:'#E0892F',limit:''}; }\n  blankPocket(){ return {name:'',emoji:'\ud83c\udfaf',targetAmount:'',savedAmount:'',deadline:''}; }\n\n  \u002F* ---------- navigation ---------- *\u002F\n  go(view){ this.setState({view, categoryId:null, err:null}); }\n  goDashboard(){ this.go('dashboard'); }\n  prevMonth(){ this.setState(s=>({selectedMonth:this.addMonths(s.selectedMonth,-1)})); }\n  nextMonth(){ this.setState(s=>({selectedMonth:this.addMonths(s.selectedMonth,1)})); }\n  closeModal(){ this.setState({modal:null, err:null}); }\n  stop(e){ if(e && e.stopPropagation) e.stopPropagation(); }\n  upd(key, field, val){ this.setState(s=>({[key]:Object.assign({}, s[key], {[field]:val}), err:null})); }\n\n  \u002F* ---------- expenses ---------- *\u002F\n  openAddExpense(){ this.setState({modal:'expense', editExpenseId:null, err:null, ef:Object.assign(this.blankExpense(), {categoryId:''})}); }\n  addExpenseHere(){ this.setState({modal:'expense', editExpenseId:null, err:null, ef:Object.assign(this.blankExpense(), {categoryId:this.state.categoryId})}); }\n  openEditExpense(e){ this.setState({modal:'expense', editExpenseId:e.id, err:null, ef:{amount:String(e.amount), categoryId:e.categoryId, date:e.date, note:e.note||''}}); }\n  saveExpense(){\n    const f=this.state.ef; const amt=parseFloat(f.amount);\n    if(!(amt>0)) return this.setState({err:'Enter an amount greater than 0.'});\n    if(!f.categoryId) return this.setState({err:'Pick a category.'});\n    if(!f.date) return this.setState({err:'Pick a date.'});\n    const next=this.clone();\n    if(this.state.editExpenseId){ const ex=next.expenses.find(x=>x.id===this.state.editExpenseId); if(ex) Object.assign(ex,{categoryId:f.categoryId,amount:amt,date:f.date,note:(f.note||'').trim()}); }\n    else next.expenses.push({id:this.uid(),categoryId:f.categoryId,amount:amt,date:f.date,note:(f.note||'').trim()});\n    this.commit(next); this.setState({modal:null, err:null});\n  }\n  askDeleteExpense(e){ this.openConfirm({title:'Delete this expense?', message:this.fmt(e.amount)+(e.note?' \u00b7 '+e.note:''), label:'Delete', danger:true, onConfirm:()=>{ const next=this.clone(); next.expenses=next.expenses.filter(x=>x.id!==e.id); this.commit(next); }}); }\n\n  \u002F* ---------- categories ---------- *\u002F\n  openAddCategory(){ this.setState({modal:'category', err:null, cf:this.blankCategory()}); }\n  saveNewCategory(){\n    const f=this.state.cf; const name=(f.name||'').trim();\n    if(!name) return this.setState({err:'Enter a category name.'});\n    if(this.state.data.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())) return this.setState({err:'A category with that name already exists.'});\n    const next=this.clone();\n    next.categories.push({id:this.uid(),name,emoji:f.emoji||'\ud83d\udfe1',color:f.color||'#E0892F',monthlyLimit:parseFloat(f.limit)||0});\n    this.commit(next); this.setState({modal:null, err:null});\n  }\n  openCategory(id){ const c=this.state.data.categories.find(x=>x.id===id); if(!c) return; this.setState({view:'category', categoryId:id, catTab:'expenses', err:null, cf:{name:c.name,emoji:c.emoji,color:c.color,limit:c.monthlyLimit?String(c.monthlyLimit):''}}); }\n  saveCategoryEdits(){\n    const f=this.state.cf; const name=(f.name||'').trim();\n    if(!name) return this.setState({err:'Enter a category name.'});\n    if(this.state.data.categories.some(c=>c.id!==this.state.categoryId && c.name.toLowerCase()===name.toLowerCase())) return this.setState({err:'Another category already has that name.'});\n    const next=this.clone(); const c=next.categories.find(x=>x.id===this.state.categoryId);\n    if(c) Object.assign(c,{name,emoji:f.emoji,color:f.color,monthlyLimit:parseFloat(f.limit)||0});\n    this.commit(next); this.setState({err:null});\n  }\n  openDeleteCategory(){\n    const id=this.state.categoryId; const has=this.state.data.expenses.some(e=>e.categoryId===id);\n    if(has) this.setState({modal:'delCat', err:null, delCat:{mode:'reassign', reassignTo:''}});\n    else this.openConfirm({title:'Delete this category?', message:'It has no expenses.', label:'Delete', danger:true, onConfirm:()=>this.doDeleteCategory('delete')});\n  }\n  confirmDeleteCategory(){ this.doDeleteCategory(this.state.delCat.mode); }\n  doDeleteCategory(mode){\n    const id=this.state.categoryId; const next=this.clone();\n    if(mode==='reassign'){ const to=this.state.delCat.reassignTo; if(!to) return this.setState({err:'Choose a category to move expenses into.'}); next.expenses.forEach(e=>{ if(e.categoryId===id) e.categoryId=to; }); }\n    else { next.expenses=next.expenses.filter(e=>e.categoryId!==id); }\n    next.categories=next.categories.filter(c=>c.id!==id);\n    this.commit(next); this.setState({modal:null, confirm:null, view:'dashboard', categoryId:null, err:null});\n  }\n\n  \u002F* ---------- pockets ---------- *\u002F\n  openAddPocket(){ this.setState({modal:'pocket', editPocketId:null, err:null, pf:this.blankPocket()}); }\n  openEditPocket(p){ this.setState({modal:'pocket', editPocketId:p.id, err:null, pf:{name:p.name,emoji:p.emoji,targetAmount:String(p.targetAmount),savedAmount:String(p.savedAmount),deadline:p.deadline||''}}); }\n  savePocket(){\n    const f=this.state.pf; const name=(f.name||'').trim(); const target=parseFloat(f.targetAmount);\n    if(!name) return this.setState({err:'Enter a pocket name.'});\n    if(!(target>0)) return this.setState({err:'Target must be greater than 0.'});\n    const saved=Math.max(0, parseFloat(f.savedAmount)||0);\n    const next=this.clone();\n    if(this.state.editPocketId){ const p=next.savingsGoals.find(x=>x.id===this.state.editPocketId); if(p) Object.assign(p,{name,emoji:f.emoji,targetAmount:target,savedAmount:saved,deadline:f.deadline||''}); }\n    else next.savingsGoals.push({id:this.uid(),name,emoji:f.emoji||'\ud83c\udfaf',targetAmount:target,savedAmount:saved,deadline:f.deadline||''});\n    this.commit(next); this.setState({modal:null, err:null});\n  }\n  deletePocketFromModal(){ const id=this.state.editPocketId; this.openConfirm({title:'Delete this pocket?', message:'Your saved progress for it will be removed.', label:'Delete', danger:true, onConfirm:()=>{ const next=this.clone(); next.savingsGoals=next.savingsGoals.filter(p=>p.id!==id); this.commit(next); this.setState({modal:null}); }}); }\n  askDeletePocket(p){ this.openConfirm({title:'Delete \u201c'+p.name+'\u201d?', message:'This saving pocket will be removed.', label:'Delete', danger:true, onConfirm:()=>{ const next=this.clone(); next.savingsGoals=next.savingsGoals.filter(x=>x.id!==p.id); this.commit(next); }}); }\n  openAdjust(p, mode){ this.setState({modal:'adjust', err:null, af:{pocketId:p.id, pocketName:p.name, amount:'', mode}}); }\n  saveAdjust(){\n    const f=this.state.af; const amt=parseFloat(f.amount);\n    if(!(amt>0)) return this.setState({err:'Enter an amount greater than 0.'});\n    const next=this.clone(); const p=next.savingsGoals.find(x=>x.id===f.pocketId);\n    if(p) p.savedAmount=Math.max(0, Number(p.savedAmount) + (f.mode==='withdraw'? -amt : amt));\n    this.commit(next); this.setState({modal:null, err:null});\n  }\n\n  \u002F* ---------- savings log ---------- *\u002F\n  openLogSavings(month){\n    const mo = month || this.state.selectedMonth;\n    const ex=this.state.data.monthlySavings.find(x=>x.month===mo);\n    const suggested=Math.max(0, this.totalLimit() - this.totalSpentMonth(mo));\n    this.setState({modal:'savingsLog', err:null, savingsSuggested:suggested, lf:{month:mo, amount: ex?String(ex.amount):''}});\n  }\n  applySavSuggestion(){ this.upd('lf','amount', String(this.state.savingsSuggested)); }\n  saveSavingsLog(){\n    const f=this.state.lf; const amt=parseFloat(f.amount);\n    if(!f.month) return this.setState({err:'Pick a month.'});\n    if(!(amt>=0) || isNaN(amt)) return this.setState({err:'Enter an amount (0 or more).'});\n    const next=this.clone(); const ex=next.monthlySavings.find(x=>x.month===f.month);\n    if(ex) ex.amount=amt; else next.monthlySavings.push({month:f.month, amount:amt});\n    this.commit(next); this.setState({modal:null, err:null});\n  }\n\n  \u002F* ---------- settings + backup ---------- *\u002F\n  openSettings(){ const s=this.state.data.settings; this.setState({modal:'settings', err:null, stf:{currencySymbol:s.currencySymbol, currencyPosition:s.currencyPosition, monthStartDay:String(s.
